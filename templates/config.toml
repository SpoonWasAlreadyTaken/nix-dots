[general]
title = "Satty"
app-id = "org.satty.satty"

fullscreen = false

resize = { mode = "smart" }

floating-hack = true
default-hide-toolbars = false
focus-toggles-toolbars = false
no-window-decoration = true

notification-thumbnail = "screenshot"
disable-notifications = false

early-exit = ["all"]

auto-copy = false
copy-command = "wl-copy"
save-after-copy = false

output-filename = "~/Downloads/screenshot-%Y-%m-%d_%H:%M:%S.png"

initial-tool = "brush"
primary-highlighter = "block"
annotation-size-factor = 2
corner-roundness = 12
default-fill-shapes = false
default-round-caps = true
brush-smooth-history-size = 10

actions-on-right-click = []
# [possible values: save-to-clipboard, save-to-file, save-to-file-as, copy-filepath-to-clipboard, exit]
actions-on-enter = ["save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
pan-step-size = 50.0
zoom-factor = 1.1
text-move-length = 50.0
input-scale = 1.0


[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"


[font]
family = "Cascadia Code"
style = "Regular"

[color-palette]
palette = [
    "@primary@ff",
    "@secondary@ff",
    "@tertiary@ff",
    "@accent@ff",
    "@saturated@ff",
    "@background@ff",
]

custom = [
    # "#a52a2a",
    # "#ffd700",
    # "#008000",
    # add or remove as needed
]

