#fg (Color): Foreground color
#bg (Color): Background color
#bold (Boolean): Bold
#dim (Boolean): Dim (not supported by all terminals)
#italic (Boolean): Italic
#underline (Boolean): Underline
#blink (Boolean): Blink
#blink_rapid (Boolean): Rapid blink
#reversed (Boolean): Reversed foreground and background colors
#hidden (Boolean): Hidden
#crossed (Boolean): Crossed out
# { fg = "@primary@", bg = "@background@" }

[app]
overall = { bg = "@background@" }


[mgr]
cwd = { fg = "@dim@", bg = "@background@", bold = true, italic = true }
find_keyword = { fg = "@tertiary@", italic = true }
find_position = { bold = true }
symlink_target = { italic = true }
marker_copied = { fg = "@secondary@" }
marker_cut = { fg = "@dim@" }
marker_marked = { fg = "@accent@" }
marker_selected = { fg = "@tertiary@" }
count_copied = { fg = "@accent@" }
count_cut = { fg = "@accent@" }
count_selected = { fg = "@accent@" }
border_style = { fg = "@sSecondary@", bold = true }


[indicator]
parent = { fg = "@background@", bg = "@primary@", bold = true }
current = { fg = "@background@", bg = "@primary@", bold = true }
preview = { fg = "@background@", bg = "@primary@", bold = true }
padding = { open = "",  close = "" }


[tabs]
active = { fg = "@background@", bg = "#a769ff", bold = true }
inactive = { fg = "#a769ff", bg = "@dark@" }
sep_inner = { open = "",  close = "" }
sep_outer = { open = "",  close = "" }


[mode]
normal_main = { fg = "@background@", bg = "@primary@", bold = true }
normal_alt = { fg = "@background@", bg = "@pDark@", bold = true }
select_main = { fg = "@background@", bg = "#f1cfff", bold = true }
select_alt = { fg = "@background@", bg = "@pDark@", bold = true }
unset_main = { fg = "@background@", bg = "@primary@", bold = true }
unset_alt = { fg = "@background@", bg = "@pDark@", bold = true }



[status]
sep_left = {  open = "",  close = "" }
sep_right = {  open = "",  close = "" }
perm_type = { fg = "#beb7ff" }
perm_read = { fg = "#6f009c" }
perm_write = { fg = "#b568d4" }
perm_exec = { fg = "#a769ff" }
progress_label = { fg = "@background@", bold = true }
progress_normal = { fg = "@secondary@" }
progress_error = { fg = "#e62946" }


[which]
mask = { bg = "@dark@" }
cand = { fg = "#ffe770" }
rest = { fg = "#26324d" }
desc = { fg = "@dim@" }
seperator = "󰜶"
seperator_style = { fg = "@sSecondary@"}


[confirm]
border = { fg = "@sSecondary@" }
title = { fg = "@primary@" }
body = { fg = "#f1cfff" }
list = { fg = "@dim@" }
btn_yes = { fg = "#5abf9f" }
btn_no = { fg = "#e62946" }
btn_labels = [ "", "" ]


[spot]
border = { fg = "@sSecondary@" }
title = { fg = "@sSecondary@" }
tbl_col = { fg = "#00c7a2" }
rbl_cell = { fg = "@background@", bg = "#ffe770" }


[notify]
title_info = { fg = "#f1cfff", bold = true }
title_warn = { fg = "@accent@", bold = true }
title_error = { fg = "#e62946", bold = true }


[pick]
border = { fg = "@sSecondary@" }
active = { fg = "@primary@" }
inactive = { fg = "@dim@" }


[input]
border = { fg = "@sSecondary@" }
title = { fg = "@sSecondary@" }
value = { fg = "#f1cfff" }
selected = { fg = "@background@", bg = "#beb7ff", bold = true }


[tasks]
border = { fg = "@sSecondary@" }
title = { fg = "@sSecondary@" }
hovered = { fg = "@background@", bg = "#beb7ff", bold = true}


[help]
on = { fg = "@primary@" }
run = { fg = "@pLight@" }
desc = { fg = "@dim@" }
hovered = { fg = "@background@", bg = "#beb7ff", bold = true }
footer = { fg = "@sSecondary@" }
icon_info = { fg = "#f1cfff", bold = true }
icon_warn = { fg = "@accent@", bold = true }
icon_error = { fg = "#e62946", bold = true }


