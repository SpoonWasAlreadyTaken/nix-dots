format = """  
$directory\
$git_branch\
$git_status\
$cmd_duration\
$shell\
$nix_shell\
$line_break\
$character\
$sudo"""

[directory]
format = '[ 󱞬 ](fg:@dim@ bg:@background@)[](fg:@primary@ bg:@background@)[$path ](fg:@background@ bg:@primary@ bold)[](fg:@primary@ bg:@pLight@)'
truncation_symbol = '.../'

[git_branch]
format = '[ $symbol$branch(:$remote_branch) ](fg:@background@ bg:@pLight@ bold)'

[git_status]
format = '[$all_status$ahead_behind ](fg:@background@ bg:@pLight@ bold)'
conflicted = '󰦎'
worktree_added = ''
worktree_deleted = '󰮘'
worktree_modified = ''

[cmd_duration]
min_time = 0
show_milliseconds = true
format = '[](fg:@pLight@ bg:@pLighter@)[ $duration ](fg:@background@ bg:@pLighter@ bold)[](fg:@pLighter@ bg:@background@)'

[shell]
format = '[ $indicator](fg:#6f009c bg:@background@ bold)'
bash_indicator =' '
fish_indicator = ' '
zsh_indicator = '󰬇 '
powershell_indicator = ' '
unknown_indicator = ' '
disabled = false

[nix_shell]
format = '[ $name](fg:#a769ff bg:@background@ bold)[ $symbol $state ](fg:#a769ff bg:@background@ bold)'
symbol = ''
unknown_msg = ''
impure_msg = ''
pure_msg = ''


[character]
success_symbol = "[ 󱞪](fg:@dim@ bg:@background@)"
error_symbol = "[ 󱞪](fg:#e62946 bg:@background@)"
vimcmd_symbol = "[ 󱞪](fg:@accent@ bg:@background@)"

[sudo]
format = '[ ]($style)'
style = 'fg:#e62946 bg:@background@ bold'
disabled = false






