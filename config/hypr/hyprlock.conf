source = ~/.config/theme/hyprcolors.conf

general {
    hide_cursor = true
    disable_screencopy = true
}

background {
    monitor =
    path =
    blur_size = 5
    blur_passes = 3
    noise = 0.001
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    color = rgba(0,0,0,0.0)
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true

    outer_color = $primary $tertiary
    inner_color = $background

    font_color = $primary

    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text = <i>Password...</i>
    fail_text = <i>FUCK YOU</i>

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $sPrimary
    font_size = 64
    font_family = CayskadiaCove Nerd Font

    position = 0, 200
    halign = center
    valign = center
}
